# 1-shot 예시 — 입찰참가신청서 (별지 제13호 서식)
# 필드별 크롭 전환(2026-04-22)에 따라 scalar 응답 단위 예시로 단순화.
# 실제 샘플과 의도적으로 다른 가상 데이터를 사용하여 평가 오염 방지.
form_type: bid_application

common_rules: |
  CRITICAL RULES:
  1. Extract ONLY what is physically written in the image.
  2. Do NOT infer, guess, or substitute with similar-sounding words.
  3. If a character is unclear, mark it as [?].
  4. Read every character independently.
  Similar characters: 숫자 1/7, 6/0, 3/8 / 한글 받침 ㄱ/ㄴ/ㄹ/ㅅ

examples:
  - field_key: company_name
    example_response: "(주) 한국방산기술"

  - field_key: corporate_reg_number
    example_response: "13456-7891234"

  - field_key: address
    example_response: "경기도 성남시 분당구 판교로 45, 8층"

  - field_key: bid_name
    example_response: "육군 장갑차 부품 정비 장비 도입 사업"

  - field_key: acquisition_date
    example_response: "2022년 06월 03일"

  - field_key: agent_name
    example_response: "최민준"

  - field_key: seal_issuing_office
    example_response: "경기도 성남시 분당구"

  - field_key: seal_issue_number
    example_response: "2023-SN-98765"
