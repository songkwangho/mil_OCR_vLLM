# Layer 1 공통 필드 패턴 검증 — 전 서식 대상
#
# FieldPatternValidator가 form_type 무관하게 모든 FieldValue에 적용합니다.
# data_type 기준(규칙에 data_type 명시)과 field_key 기준 두 축으로 정의.

field_type_patterns:
  - data_type: date
    pattern: '^\d{4}년 \d{1,2}월 \d{1,2}일$'
    penalty: -0.10
    severity: medium
    normalize:
      # "2024년5월20일" → "2024년 05월 20일"
      regex: '(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일'
      template: '{1}년 {2:02d}월 {3:02d}일'

  - data_type: phone
    pattern: '^\d{2,3}-\d{3,4}-\d{4}$'
    penalty: -0.05
    severity: low
    normalize:
      strip_chars: ' '

  - data_type: amount
    pattern: '^\d+$'
    penalty: -0.10
    severity: medium

field_key_patterns:
  - field_key: corporate_reg_number
    pattern: '^\d{5}-\d{7}$'
    penalty: -0.15
    severity: medium

  - field_key: business_reg_number
    pattern: '^\d{3}-\d{2}-\d{5}$'
    penalty: -0.15
    severity: medium

  - field_key: nsn
    pattern: '^\d{4}-\d{2}-\d{3}-\d{4}$'
    penalty: -0.15
    severity: medium

  - field_key: k_nsn
    pattern: '^KN-\d{5}-\d{4}$'
    penalty: -0.15
    severity: medium

  - field_key: unit_code
    pattern: '^\d{2,4}$'
    penalty: -0.10
    severity: low

  - field_key: announcement_number
    pattern: '^\d{4}-DAPA-[A-Z]+-\d+$'
    penalty: -0.10
    severity: low

  - field_key: seal_issue_number
    pattern: '^\d{4}-[A-Z]+-\d+$'
    penalty: -0.05
    severity: low
