# 영역 유형 → VLM instruction 매핑
# P2 레이아웃 분석과 독립적으로 관리

task_prompts:
  text: "OCR:"
  table: "Table Recognition:"
  formula: "Formula Recognition:"
  chart: "Chart Recognition:"
  seal: "Seal Recognition:"
  header: "OCR:"
  footer: "OCR:"
  figure: "Image Description:"

region_instructions:
  text: "이 영역의 한국어 텍스트를 인식하고 오타를 교정하세요."
  table: "이 표의 구조를 분석하고 각 셀의 텍스트를 추출하세요.\nHTML <table> 형식으로 표 구조를 출력하세요."
  formula: "이 수식을 인식하세요."
  chart: "이 차트/그래프를 분석하고 데이터를 추출하세요."
  seal: "이 인장/직인의 텍스트를 인식하세요."
  header: "이 헤더 영역의 텍스트를 인식하세요."
  footer: "이 푸터 영역의 텍스트를 인식하세요."
  figure: "이 이미지/도표의 내용을 설명하세요."

extraction_instructions:
  supply_request: >-
    이 보급청구서 이미지에서 모든 필드를 추출하세요.
    청구부대, 물자코드(NSN), 품목명, 수량, 단가, 합계, 청구일자,
    승인일자, 결재권자 등을 포함합니다.
    수기로 기입된 부분도 정확히 인식하고, 오타가 있으면 교정하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
  maintenance_record: >-
    이 정비기록서 이미지에서 모든 필드를 추출하세요.
    장비번호, 정비유형, 정비일자, 정비자, 정비내용, 사용부품,
    정비결과 등을 포함합니다.
    수기 기입 부분도 정확히 인식하고, 오타가 있으면 교정하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
  inventory_sheet: >-
    이 물자현황표 이미지에서 모든 필드를 추출하세요.
    품목명, 물자코드, 재고수량, 보관위치, 불용수량, 적부 판정 등을 포함합니다.
    수기 기입 부분도 정확히 인식하고, 오타가 있으면 교정하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
  handover_doc: >-
    이 인수인계서 이미지에서 모든 필드를 추출하세요.
    인계자, 인수자, 인수인계일자, 품목목록, 수량, 상태 등을 포함합니다.
    수기 기입 부분도 정확히 인식하고, 오타가 있으면 교정하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
  inspection_report: >-
    이 검사보고서 이미지에서 모든 필드를 추출하세요.
    검사일자, 검사자, 검사유형, 점검항목별 결과, 종합판정 등을 포함합니다.
    수기 기입 부분도 정확히 인식하고, 오타가 있으면 교정하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
  unknown: >-
    이 군수 서식 이미지에서 가능한 모든 필드를 추출하세요.
    문서 제목, 날짜, 작성자, 부대코드 및 모든 key-value 쌍과
    표 데이터를 포함합니다.
    수기 기입 부분도 정확히 인식하세요.
    지정된 JSON 형식에 맞춰 응답하세요.
