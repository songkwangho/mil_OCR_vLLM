# 행정구역 계층 사전 — Layer 3 교정용
# 용도:
#   1. business_location 별칭 정규화 ("서울시" → "서울특별시")
#   2. address ↔ business_location 일관성 교정
#   3. VLM 오인식 지명 Levenshtein 최근접 보정

# 별칭 정규화 (alias → canonical)
aliases:
  서울시:   서울특별시
  서울:     서울특별시
  부산시:   부산광역시
  부산:     부산광역시
  대구시:   대구광역시
  대구:     대구광역시
  인천시:   인천광역시
  인천:     인천광역시
  광주시:   광주광역시
  광주:     광주광역시
  대전시:   대전광역시
  대전:     대전광역시
  울산시:   울산광역시
  울산:     울산광역시
  세종시:   세종특별자치시
  세종:     세종특별자치시
  경기:     경기도
  강원:     강원특별자치도
  강원도:   강원특별자치도
  충북:     충청북도
  충남:     충청남도
  전북:     전북특별자치도
  전북도:   전북특별자치도
  전남:     전라남도
  경북:     경상북도
  경남:     경상남도
  제주:     제주특별자치도
  제주도:   제주특별자치도

