# configs/form_templates/bid_application.yaml
#
# 입찰참가신청서 (별지 제13호 서식)
# 군수품조달관리규정 / 방위사업청
#
# 좌표 기준:
#   - P1 Deskew + DPI 300 정규화 이후 이미지
#   - A4 세로 스캔 기준: 2480×3508 px
#   - fields: 실측값 (2026-04-20 기준)
#   - fixed_text: 인쇄 고정 텍스트 bbox + 원문 값
#
# 설계 원칙:
#   - 수기 블록(fields)은 블록 단위로 지정 (sub-schema 분해 전제)
#   - 인쇄 고정 텍스트(fixed_text)는 Assembler가 assembled_json에 직접 삽입
#     → VLM 추론 대상에서 제외하여 토큰 낭비 방지 + PP-DocLayout 탐지 영역 정리

form_type: bid_application

versions:
  - version: "1.0"
    effective_date: "2024-01-01"
    form_identifier: "별지 제13호 서식"
    page_size: [2480, 3508]
    description: "입찰참가신청서 서식(국내, 국제) — 방위사업청 조달"

    fields:
      - field_key: doc_number
        region_type: handwritten_field
        bbox: {x1: 331, y1: 466, x2: 537, y2: 531}
        description: "제 호 — 문서번호 수기란"

      - field_key: applicant_block
        region_type: handwritten_field
        bbox: {x1: 321, y1: 626, x2: 2128, y2: 1147}
        description: "신청인 전체 블록 (상호~사업자등록번호)"

      - field_key: bid_info_block
        region_type: handwritten_field
        bbox: {x1: 321, y1: 1132, x2: 2128, y2: 1498}
        description: "입찰개요 전체 블록 (공고번호~발행관서)"

      - field_key: agent_block
        region_type: handwritten_field
        bbox: {x1: 321, y1: 1493, x2: 1169, y2: 1954}
        description: "대리인 성명·생년월일 수기란"

      - field_key: agent_seal
        region_type: seal
        bbox: {x1: 1164, y1: 1488, x2: 2118, y2: 1964}
        description: "사용인감 날인란"

      - field_key: submission_block
        region_type: handwritten_field
        bbox: {x1: 321, y1: 2230, x2: 2113, y2: 2580}
        description: "신청일자 + 신청인 대표자 성명 수기란"

      - field_key: seal_verification_block
        region_type: table
        bbox: {x1: 316, y1: 2565, x2: 2118, y2: 2791}
        description: "인감증명확인 테이블"

    # 인쇄 고정 텍스트 — VLM 추론 대상에서 제외하고 Assembler가 값을 직접 삽입
    fixed_text:
      - field_key: body_text
        bbox: {x1: 60, y1: 1960, x2: 2420, y2: 2240}
        value: "본인은 위의 번호로 공고(지명통지)한 귀부(처·청)의 일반(제한·지명)경쟁입찰에 참가하고자 정부에서 정한 물품구매(공사·기술용역) 입찰유의서 및 입찰공고 사항을 모두 승낙하고 입찰참가 신청을 합니다."
        description: "인쇄 고정 법적 고지 문구"

      - field_key: seal_note
        bbox: {x1: 60, y1: 2180, x2: 1200, y2: 2240}
        value: "※ 인감증명서 1통 : 휴대/제시"
        description: "인감증명서 안내 문구"

      - field_key: form_title
        value: "입찰참가신청서 서식(국내,국제)"
        description: "서식 제목 (bbox 없음 — region 제거 없이 값만 삽입)"
