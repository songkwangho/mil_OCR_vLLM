# configs/form_templates/bid_application.yaml
#
# 입찰참가신청서 (별지 제13호 서식)
# 군수품조달관리규정 / 방위사업청
#
# 좌표 기준:
#   - P1 Deskew + DPI 300 정규화 이후 이미지
#   - A4 세로 스캔 기준: 2480×3508 px
#   - fields: 필드별 실측 bbox (2026-04-22 기준, 블록→필드 단위 전환)
#   - fixed_text: 인쇄 고정 텍스트 bbox + 원문 값
#
# 설계 원칙:
#   - 수기 블록을 22개 field_key로 세분화하여 각 크롭에 1120 토큰 집중
#   - 인쇄 고정 텍스트(fixed_text)는 Assembler가 assembled_json에 직접 삽입

form_type: bid_application

versions:
  - version: "1.0"
    effective_date: "2024-01-01"
    form_identifier: "별지 제13호 서식"
    page_size: [2480, 3508]
    description: "입찰참가신청서 서식(국내, 국제) — 방위사업청 조달"

    fields:
      # ── 신청인 섹션 ─────────────────────────────────────────
      - field_key: company_name
        region_type: handwritten_field
        bbox: {x1: 697, y1: 631, x2: 1159, y2: 791}
        description: "상호 또는 법인명칭"

      - field_key: corporate_reg_number
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 631, x2: 2128, y2: 801}
        description: "법인등록번호 NNNNN-NNNNNNN"

      - field_key: representative
        region_type: handwritten_field
        bbox: {x1: 697, y1: 791, x2: 1164, y2: 912}
        description: "대표자 성명"

      - field_key: representative_dob
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 791, x2: 2128, y2: 912}
        description: "대표자 생년월일"

      - field_key: address
        region_type: handwritten_field
        bbox: {x1: 697, y1: 912, x2: 1164, y2: 1033}
        description: "주소 — 도로명 추론 금지"

      - field_key: phone
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 912, x2: 2128, y2: 1033}
        description: "전화번호"

      - field_key: business_location
        region_type: handwritten_field
        bbox: {x1: 697, y1: 1033, x2: 1164, y2: 1147}
        description: "사업장소재지"

      - field_key: business_reg_number
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 1033, x2: 2128, y2: 1147}
        description: "사업자등록번호 NNN-NN-NNNNN"

      # ── 입찰개요 섹션 ───────────────────────────────────────
      - field_key: announcement_number
        region_type: handwritten_field
        bbox: {x1: 697, y1: 1147, x2: 1164, y2: 1270}
        description: "입찰공고(지명)번호"

      - field_key: bid_date
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 1147, x2: 2128, y2: 1270}
        description: "입찰일자"

      - field_key: bid_name
        region_type: handwritten_field
        bbox: {x1: 697, y1: 1270, x2: 1164, y2: 1380}
        description: "입찰건명 — 이미지 글자 그대로, 추론 금지"

      - field_key: item_code
        region_type: handwritten_field
        bbox: {x1: 1571, y1: 1270, x2: 2128, y2: 1380}
        description: "품목코드"

      - field_key: industry_class_number
        region_type: handwritten_field
        bbox: {x1: 697, y1: 1380, x2: 900, y2: 1498}
        description: "해당산업분류번호"

      - field_key: acquisition_date
        region_type: handwritten_field
        bbox: {x1: 1159, y1: 1373, x2: 1485, y2: 1498}
        description: "취득일 — 연/월/일 모두 포함 필수"

      - field_key: issuing_office
        region_type: handwritten_field
        bbox: {x1: 1802, y1: 1373, x2: 2118, y2: 1498}
        description: "발행관서"

      # ── 대리인 섹션 ─────────────────────────────────────────
      - field_key: agent_name
        region_type: handwritten_field
        bbox: {x1: 667, y1: 1673, x2: 1149, y2: 1824}
        description: "대리인 성명 — 받침 획 주의"

      - field_key: agent_dob
        region_type: handwritten_field
        bbox: {x1: 657, y1: 1829, x2: 1149, y2: 1939}
        description: "대리인 생년월일"

      - field_key: agent_seal
        region_type: seal
        bbox: {x1: 1164, y1: 1488, x2: 2118, y2: 1964}
        description: "사용인감 날인란"

      # ── 신청 정보 섹션 ──────────────────────────────────────
      - field_key: submission_date
        region_type: handwritten_field
        bbox: {x1: 1521, y1: 2305, x2: 2043, y2: 2425}
        description: "신청일자"

      - field_key: submitter_name
        region_type: handwritten_field
        bbox: {x1: 1074, y1: 2370, x2: 1380, y2: 2510}
        description: "신청인 대표자 성명"

      # ── 인감증명확인 섹션 ───────────────────────────────────
      - field_key: seal_issuing_office
        region_type: handwritten_field
        bbox: {x1: 612, y1: 2666, x2: 918, y2: 2781}
        description: "인감증명 발급관서"

      - field_key: seal_issue_number
        region_type: handwritten_field
        bbox: {x1: 918, y1: 2666, x2: 1218, y2: 2781}
        description: "인감증명 발급번호"

      - field_key: seal_issue_date
        region_type: handwritten_field
        bbox: {x1: 1218, y1: 2666, x2: 1518, y2: 2781}
        description: "인감증명 발급일자"

      - field_key: seal_signature
        region_type: seal
        bbox: {x1: 1818, y1: 2666, x2: 2118, y2: 2781}
        description: "서명/날인"

    # 인쇄 고정 텍스트 — VLM 추론 대상에서 제외하고 Assembler가 값을 직접 삽입
    fixed_text:
      - field_key: body_text
        bbox: {x1: 60, y1: 1960, x2: 2420, y2: 2240}
        value: "본인은 위의 번호로 공고(지명통지)한 귀부(처·청)의 일반(제한·지명)경쟁입찰에 참가하고자 정부에서 정한 물품구매(공사·기술용역) 입찰유의서 및 입찰공고 사항을 모두 승낙하고 입찰참가 신청을 합니다."
        description: "인쇄 고정 법적 고지 문구"

      - field_key: seal_note
        bbox: {x1: 60, y1: 2180, x2: 1200, y2: 2240}
        value: "※ 인감증명서 1통 : 휴대/제시"
        description: "인감증명서 안내 문구"

      - field_key: form_title
        value: "입찰참가신청서 서식(국내,국제)"
        description: "서식 제목 (bbox 없음 — region 제거 없이 값만 삽입)"
